name: pages

# Publishes reader-path/viewer/ as the site root. The reader-path
# tests check that viewer/index.html matches the template.
on:
  push:
    branches: [main]
    paths:
      - 'reader-path/viewer/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: reader-path/viewer
      - id: deploy
        uses: actions/deploy-pages@v5
