<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Dots</title><style>
body{margin:0;font:16px/1.6 sans-serif}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%}
.g{background:#2e7d32}.r{background:#c62828}.a{background:#ffb300}
.sr{position:absolute;left:-9999px}
</style></head><body><main><h1>Status</h1>
<div id="status"><span class="dot g"></span><span class="dot r"></span><span class="dot a"></span></div>
<div id="named"><span class="dot g"><span class="sr">Running</span></span><span class="dot r"><span class="sr">Stopped</span></span><span class="dot a"><span class="sr">Pending</span></span></div>
</main></body></html>
