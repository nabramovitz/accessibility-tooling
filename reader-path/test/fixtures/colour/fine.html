<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fine</title><style>
body{margin:0;font:16px/1.6 sans-serif}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%}
.big{display:inline-block;width:40px;height:40px}
.g{background:#2e7d32}.r{background:#c62828}
</style></head><body><main><h1>Fine</h1>
<div id="same"><span class="dot g"></span><span class="dot g"></span><span class="dot g"></span></div>
<div id="label"><span class="dot g"></span> Running <span class="dot r"></span> Stopped</div>
<div id="aria"><span class="dot g" aria-label="Running" role="img"></span><span class="dot r" aria-label="Stopped" role="img"></span></div>
<div id="title"><span class="dot g" title="Running"></span><span class="dot r" title="Stopped"></span></div>
<div id="big"><span class="big g"></span><span class="big r"></span></div>
<div id="one"><span class="dot r"></span></div>
<div id="classes"><span class="dot g"></span><b class="dot r"></b></div>
</main></body></html>
