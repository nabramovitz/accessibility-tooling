<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Motion</title>
<style>@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:20px;height:20px;border:2px solid;animation:spin 1s linear infinite}
@media (prefers-reduced-motion: reduce){#calm{animation:none}}</style></head>
<body><main><h1>Motion</h1><div id="busy" class="spin"></div><div id="calm" class="spin"></div></main></body></html>
