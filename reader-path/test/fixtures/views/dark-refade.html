<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dark refade</title>
<style>body{background:#fff;color:#111;font:16px sans-serif;transition:background-color 600ms,color 600ms}
@media (prefers-color-scheme: dark){body{background:#888;color:#777}}
html.dark body{background:#222;color:#555}</style></head>
<body><main><h1>Dark refade</h1><p>Text whose second fade ends dim in the dark scheme.</p></main>
<script>
// Like an app that follows the scheme: a class comes a moment after the
// media change and starts a second fade that cancels the first.
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
  setTimeout(() => document.documentElement.classList.toggle('dark', e.matches), 100);
});
</script></body></html>
