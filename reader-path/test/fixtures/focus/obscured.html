<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Focus obscured</title>
<style>body{font:16px sans-serif;margin:0;height:100vh;overflow:hidden} button{position:absolute;left:20px;width:120px;height:40px}
#free{top:40px} #half{bottom:40px} #under{bottom:10px;left:200px}
footer{position:fixed;left:0;right:0;bottom:0;height:60px;background:#333;color:#fff}</style></head>
<body><main><h1 style="margin:0">Focus obscured</h1>
<button id="free">Free</button>
<button id="half">Half covered</button>
<button id="under">Fully covered</button>
</main><footer>A bar that stays at the bottom</footer></body></html>
