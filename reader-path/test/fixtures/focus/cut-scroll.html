<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Focus ring at the bottom of the window</title>
<style>body{font:16px sans-serif;margin:0;background:#fff;position:relative}
.gap{height:300vh}
button{position:absolute;left:40px;top:calc(100vh - 41px);width:200px;height:40px;margin:0;background:#fff;border:1px solid #888}
button:focus-visible{outline:2px solid transparent;outline-offset:2px}</style></head>
<body><main><h1>Long page</h1><button aria-label="No ring low">a</button><div class="gap"></div></main></body></html>
