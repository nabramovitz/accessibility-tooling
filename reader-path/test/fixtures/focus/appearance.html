<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Focus appearance</title>
<style>body{font:16px sans-serif;margin:30px;background:#fff} div{margin:24px 0}
button{width:100px;height:30px;padding:0;border:1px solid #888;background:#fff;outline:none}
#two:focus{outline:2px solid #000}
#thin:focus{outline:1px solid #000}
#faint:focus{outline:3px solid #ddd}
#mid:focus{outline:3px solid #999}
#none:focus{outline:none}</style></head>
<body><main><h1>Focus appearance</h1>
<div><button id="two" aria-label="Two px">a</button></div>
<div><button id="thin" aria-label="One px">b</button></div>
<div><button id="faint" aria-label="Faint">c</button></div>
<div><button id="mid" aria-label="Middle grey">d</button></div>
</main></body></html>
