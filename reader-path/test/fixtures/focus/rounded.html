<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Rounded focus</title>
<style>body{font:16px sans-serif;margin:30px;background:#fff} div{margin:24px 0}
button{width:120px;height:40px;padding:0;border:none;background:#eee;outline:none}
#pill{border-radius:20px} #pill:focus{outline:2px solid #000;outline-offset:-2px}
#soft{border-radius:12px} #soft:focus{outline:2px solid #000;outline-offset:-2px}</style></head>
<body><main><h1>Rounded focus</h1>
<div><button id="pill" aria-label="Pill">a</button></div>
<div><button id="soft" aria-label="Soft corners">b</button></div>
</main></body></html>
