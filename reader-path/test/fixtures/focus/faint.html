<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Faint focus</title>
<style>body{font:16px sans-serif;margin:30px;background:#fff} div{margin:24px 0}
button{width:100px;height:30px;padding:0;border:1px solid #888;background:#fff;outline:none}
#faint:focus{background:#f6f6f6}
#ring:focus{outline:2px solid #000}</style></head>
<body><main><h1>Faint focus</h1>
<div><button id="faint" aria-label="Faint change">a</button></div>
<div><button id="ring" aria-label="Clear ring">b</button></div>
</main></body></html>
