<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Skip link</title>
<style>body{font:16px sans-serif;margin:20px}
.skip{position:absolute;left:-9999px;top:8px;outline:none}
.skip:focus{left:8px;background:#ff0}
#box{height:60px;overflow:auto;border:1px solid #666;margin:16px 0}
#box button{display:block;height:50px;margin:4px 0}</style></head>
<body><a class="skip" href="#main">Skip to content</a>
<main id="main"><h1>Skip link</h1>
<div id="box"><button>Scroll A</button><button>Scroll B</button><button>Scroll C</button></div>
<button>After</button>
</main></body></html>
