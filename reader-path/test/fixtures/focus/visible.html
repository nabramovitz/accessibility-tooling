<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Focus visible</title>
<style>body{font:16px sans-serif;margin:20px} div{margin:16px 0}
#none:focus{outline:none} #shadow:focus{outline:none;box-shadow:0 0 0 3px #06c} #field{outline:none;border:1px solid #666}</style></head>
<body><main><h1>Focus visible</h1>
<div><button id="ring">Default ring</button></div>
<div><button id="none">No indicator</button></div>
<div><button id="shadow">Box shadow</button></div>
<div><label>Empty field <input id="field" type="text"></label></div>
</main></body></html>
